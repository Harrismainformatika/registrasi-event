<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for Summit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #1c4587;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: #0d1b2a;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .header-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            color: #d4af37;
            font-weight: bold;
        }

        .header-title {
            color: #d4af37;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .main-title {
            font-size: 28px;
            font-style: italic;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .main-title span {
            color: #d4af37;
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 12px;
            color: #d4af37;
            margin-top: 5px;
            font-weight: bold;
        }

        label span {
            color: #ff4d4d;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid #415a77;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: #d4af37;
        }

        input::placeholder {
            color: #778da9;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='gold' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }

        .btn-green {
            background-color: #1b4332;
            color: #52b788;
            border: 2px dashed #52b788;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .btn-submit {
            background-color: #d4af37;
            color: #0d1b2a;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s;
        }

        .btn-submit:hover {
            background-color: #aa841c;
        }

        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Bagian Logo Atas -->
    <div class="header-logos">
        <span>Brother</span>
        <span>|</span>
        <span>Harrisma</span>
    </div>

    <!-- Bagian Judul Acara -->
    <div class="header-title">Register for Event:</div>
    <div class="main-title">
        CONNECT. COLLABORATE.<br>
        <span>TOGETHER.</span>
    </div>

    <!-- Formulir Input -->
    <form id="summitForm">
        <div class="form-group">
            <input type="text" id="fullname" placeholder="Masukkan nama lengkap Anda" required>
            <label for="fullname">Full Name: <span>*</span></label>
        </div>

        <div class="form-row">
            <div class="form-group">
                <input type="email" id="email" placeholder="contoh@perusahaan.com" required>
                <label for="email">Email: <span>*</span></label>
            </div>
            <div class="form-group">
                <input type="text" id="company" placeholder="Nama Perusahaan" required>
                <label for="company">Company Name: <span>*</span></label>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <input type="text" id="jobtitle" placeholder="Jabatan Anda" required>
                <label for="jobtitle">Job Title: <span>*</span></label>
            </div>
            <div class="form-group">
                <input type="tel" id="whatsapp" placeholder="081234567890" required>
                <label for="whatsapp">WhatsApp: <span>*</span></label>
            </div>
        </div>

        <div class="form-group">
            <select id="transport" required>
                <option value="" disabled selected hidden>Select Transportation Option</option>
                <option value="Mobil">Mobil Pribadi</option>
                <option value="Motor">Sepeda Motor</option>
                <option value="Umum">Transportasi Umum</option>
                <option value="Panitia">Akomodasi Panitia</option>
            </select>
            <label for="transport">Transportation: <span>*</span></label>
        </div>

        <!-- Tombol Submit Utama -->
        <button type="submit" class="btn-submit">
            Register Now
        </button>
    </form>
</div>

</body>
</html>
