<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register for Summit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-image: linear-gradient(rgba(14, 34, 56, 0.75), rgba(14, 34, 56, 0.75)), url('background-utama.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background-color: rgba(11, 38, 82, 0.9);
            border: 2px solid #e67e10;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.6);
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .header-logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
            color: #d4af37;
            font-weight: bold;
        }

        .header-title {
            color: #d4af37;
            font-size: 14px;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .main-title {
            font-size: 28px;
            font-style: italic;
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 25px;
            color: #ffffff;
        }

        .main-title span {
            color: #d4af37;
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            font-size: 12px;
            color: #d4af37;
            margin-top: 5px;
            font-weight: bold;
        }

        label span {
            color: #ff4d4d;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.08);
            border: 1px solid #4d7099;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: #d4af37;
        }

        input::placeholder {
            color: #a0aec0;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='gold' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }

        .btn-submit {
            background-color: #d4af37;
            color: #0d1b2a;
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #aa841c;
        }

        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(13, 27, 42, 0.9);
            border: 1px solid #d4af37;
            padding: 10px 15px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 1000;
        }

        .music-btn {
            background: #d4af37;
            color: #0d1b2a;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .music-text {
            font-size: 11px;
            color: #d4af37;
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

<audio id="bgMusic" loop src="https://soundhelix.com"></audio>

<div class="music-control">
    <span class="music-text">🎵 MUSIC</span>
    <button type="button" class="music-btn" id="musicToggle">▶</button>
</div>

<div class="container">
    <div class="header-logos">
        <span>HARRISMA</span>
        <span>|</span>
        <span>BROTHER</span>
    </div>

    <div class="header-title">Register for Summit:</div>
    <div class="main-title">
        CONNECT. COLLABORATE.<br>
        <span>TOGETHER.</span>
    </div>

    <!-- GANTI ALAMAT ACTION DI BAWAH INI DENGAN LINK WEB APP DARI GOOGLE APPS SCRIPT ANDA -->
    <form id="summitForm" method="POST" action="MASUKKAN_URL_WEB_APP_GOOGLE_ANDA_DISINI">
        <div class="form-group">
            <input type="text" id="fullname" name="fullname" placeholder="Masukkan nama lengkap Anda" required>
            <label for="fullname">Full Name: <span>*</span></label>
        </div>

        <div class="form-row">
            <div class="form-group">
                <input type="email" id="email" name="email" placeholder="contoh@perusahaan.com" required>
                <label for="email">Email: <span>*</span></label>
            </div>
            <div class="form-group">
                <input type="text" id="company" name="company" placeholder="Nama Perusahaan" required>
                <label for="company">Company Name: <span>*</span></label>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <input type="text" id="jobtitle" name="jobtitle" placeholder="Jabatan Anda" required>
                <label for="jobtitle">Job Title: <span>*</span></label>
            </div>
            <div class="form-group">
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="081234567890" required>
                <label for="whatsapp">WhatsApp: <span>*</span></label>
            </div>
        </div>

        <div class="form-group">
            <select id="Session" name="Session" required>
                <option value="" disabled selected hidden>Select Session Option</option>
                <option value="End User">End User</option>
                <option value="Partner">Partner</option>
            </select>
            <label for="Session">Event Session: <span>*</span></label>
        </div>

        <button type="submit" class="btn-submit">
            Register Now
        </button>
    </form>
</div>

<script>
    // 1. Logika Musik Latar
    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicToggle');

    musicBtn.addEventListener('click', function() {
        if (music.paused) {
            music.play();
            musicBtn.innerText = "⏸";
        } else {
            music.pause();
            musicBtn.innerText = "▶";
        }
    });

    document.addEventListener('click', function() {
        if (music.paused && musicBtn.innerText === "▶") {
            music.play().then(() => {
                musicBtn.innerText = "⏸";
            }).catch(error => console.log("Autoplay ditolak browser"));
        }
    }, { once: true });

    // 2. Logika Pengiriman Data ke Google Sheets secara Real-Time
    const form = document.getElementById('summitForm');
    form.addEventListener('submit', e => {
      e.preventDefault();
      const submitButton = form.querySelector('.btn-submit');
      submitButton.disabled = true;
      submitButton.innerText = "Sending...";

      fetch(form.action, { method: 'POST', body: new FormData(form)})
        .then(response => {
            alert('Registrasi Berhasil! Terima kasih.');
            form.reset();
            submitButton.disabled = false;
            submitButton.innerText = "Register Now";
        })
        .catch(error => {
            alert('Terjadi kesalahan pengiriman, coba lagi.');
            submitButton.disabled = false;
            submitButton.innerText = "Register Now";
        });
    });
</script>

</body>
</html>
